name: pages

# Deploys once the test workflow, which lints and tests, has passed on main.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: Bogdanp/setup-racket@v1.16
        with:
          version: stable
          distribution: full
      - run: npm ci
      - run: racket spec/render.rkt
      # The tutuca-wax demos (wax/ on the site): MoonBit builds the pinned wax-mb, which compiles
      # the runtime and the component modules; npm ci brings binaryen's wasm-opt for the build.
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - run: sh scripts/setup-wax-mb.sh
        working-directory: tutuca-wax
      - run: npm ci
        working-directory: tutuca-wax
      - run: node scripts/build.mjs
        working-directory: tutuca-wax
      - run: node scripts/site.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
