name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # site/playground/boot.js imports the codemirror bundle, which is built on demand.
      - run: node scripts/vendor.js codemirror
      - run: npm run lint
      - run: npm test
      - run: npm run dist
      - run: npm run smoke
      - uses: Bogdanp/setup-racket@v1.16
        with:
          version: stable
          distribution: full
      - run: raco test spec/
