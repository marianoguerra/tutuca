name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Lint (whose prelint builds the codemirror bundle site/playground/boot.js imports), test,
      # build dist/ and smoke test it.
      - run: npm run verify
      - uses: Bogdanp/setup-racket@v1.16
        with:
          version: stable
          distribution: full
      - run: raco test spec/
